<!DOCTYPE html>
<html>

<head>
    <title>Akhila Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        nav {
            background: black;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        nav a:hover {
            color: orange;
        }

        header {
            background: linear-gradient(to right, blue, purple);
            color: white;
            text-align: center;
            padding: 40px;
        }

        section {
            padding: 20px;
        }

        .projects {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0px 0px 10px gray;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.08);
        }

        input {
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 8px 15px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

<nav>
    <div><b>Akhila</b></div>
    <div>
        <a href="#home">Home</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<header id="home">
    <h1>Mandla Akhila</h1>
    <p>Aspiring Full Stack Developer</p>
</header>

<section>
    <h2>About Me</h2>
    <p>I am learning full stack development.</p>
</section>

<section>
    <h2>Skills</h2>
    <p>HTML, CSS, JavaScript</p>
</section>

<section id="projects">
    <h2>Projects</h2>

    <div class="projects">
        <div class="card">
            <h3>Student Form</h3>
            <p>Form with validation</p>
            <a href="https://akhila-hubb.github.io/student-form/" target="_blank">
                View Project
            </a>
        </div>
    </div>

    <br><br>

    <!-- ✅ DAY 13 MINI APP -->
    <h3>Try Demo</h3>

    <input type="text" id="name" placeholder="Enter your name">
    <br><br>

    <button onclick="showData()">Submit</button>

    <p id="result"></p>

</section>

<section id="contact">
    <h2>Contact</h2>
    <p>Email: a3281617@gmail.com</p>
</section>

<footer>
    <p>© 2026 Akhila</p>
</footer>

<!-- ✅ SCRIPT ALWAYS AT BOTTOM -->
<script>
function showData() {

    let name = document.getElementById("name").value;

    if (name === "") {
        alert("Please enter your name");
        return;
    }

    document.getElementById("result").innerHTML =
        "Hello " + name + ", welcome!";
}
</script>

</body>
</html>
