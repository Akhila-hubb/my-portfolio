<!DOCTYPE html>
<html>

<head>
    <title>Akhila Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        nav {
            background: black;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        nav a:hover {
            color: orange;
        }

        header {
            background: linear-gradient(to right, blue, purple);
            color: white;
            text-align: center;
            padding: 40px;
        }

        section {
            padding: 20px;
        }

        .projects {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0px 0px 10px gray;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.08);
        }

        input {
            padding: 8px;
            width: 200px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 15px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: darkblue;
        }

        .form-box {
            background: white;
            padding: 20px;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            margin-top: 10px;
        }

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

<nav>
    <div><b>Akhila</b></div>
    <div>
        <a href="#home">Home</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<header id="home">
    <h1>Mandla Akhila</h1>
    <p>Aspiring Full Stack Developer</p>
</header>

<section>
    <h2>About Me</h2>
    <p>I am learning full stack development.</p>
</section>

<section>
    <h2>Skills</h2>
    <p>HTML, CSS, JavaScript</p>
</section>

<section id="projects">
    <h2>Projects</h2>

    <div class="projects">
        <div class="card">
            <h3>Student Form</h3>
            <p>Form with validation</p>
            <a href="https://akhila-hubb.github.io/student-form/" target="_blank">
                View Project
            </a>
        </div>
    </div>

    <br><br>

    <!-- DAY 13 -->
    <h3>Simple Demo</h3>
    <input type="text" id="name" placeholder="Enter your name">
    <button onclick="showData()">Submit</button>
    <p id="result"></p>

    <br><br>

    <!-- DAY 14 + 15 -->
    <h3>Register Here</h3>

    <div class="form-box">
        <label>Name:</label>
        <input type="text" id="username" placeholder="Enter name">

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter email">

        <button onclick="registerUser()">Register</button>

        <p id="output2"></p>
    </div>

</section>

<section id="contact">
    <h2>Contact</h2>
    <p>Email: a3281617@gmail.com</p>
</section>

<footer>
    <p>© 2026 Akhila</p>
</footer>

<script>
function showData() {
    let name = document.getElementById("name").value;

    if (name === "") {
        alert("Please enter your name");
        return;
    }

    document.getElementById("result").innerHTML =
        "Hello " + name + ", welcome!";
}

function registerUser() {
    let name = document.getElementById("username").value;
    let email = document.getElementById("email").value;

    if (name === "" || email === "") {
        alert("Please fill all fields");
        return;
    }

    document.getElementById("output2").innerHTML =
        "Name: " + name + "<br>Email: " + email;
}
</script>

</body>
</html>
